# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - campus-gate-app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Quality gate: lint, typecheck, and tests must pass before anything deploys.
  # Also runs on pull requests (where the deploy job below is skipped).
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (client)
        run: npm run lint --prefix client

      - name: Typecheck (client)
        working-directory: client
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test (client)
        run: npm test --prefix client

      - name: Test (server)
        run: npm test --prefix server

  # A single job avoids the slow upload/download of a ~120MB artifact (node_modules)
  # between separate build and deploy jobs.
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: quality
    # Deploy only on push to main or a manual run — never on pull requests.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write # Required for requesting the OIDC JWT for Azure login
      contents: read  # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm' # Cache ~/.npm between runs for much faster installs

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Prune dev dependencies
        # Client is already built, so dev deps (vite, typescript, eslint, etc.)
        # are no longer needed. This shrinks the deployed package significantly.
        run: npm prune --omit=dev

      - name: Remove files not needed at runtime
        run: |
          rm -rf .git client/src client/public client/node_modules

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D4FB4EAF2CD04522A4EA818BE0A0D86B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FECCF0FDC8845639A83899F7F26C473 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FDA63CC29C2943D8B5503032C4742220 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'campus-gate-app'
          slot-name: 'Production'
          package: .
